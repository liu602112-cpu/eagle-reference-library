<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eagle · 作品集参考图库</title>
<style>
:root{color-scheme:light;--ink:#183238;--paper:#f7f5ef;--line:#deded5;--muted:#697577;--accent:#305e60}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Microsoft YaHei",system-ui,sans-serif}
header{padding:44px 5vw 26px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;letter-spacing:3px;color:var(--accent)}h1{font-size:32px;font-weight:600;margin:10px 0 8px}header p{margin:4px 0;color:var(--muted);overflow-wrap:anywhere}.tools{display:flex;flex-wrap:wrap;gap:12px;position:sticky;top:0;z-index:3;padding:18px 5vw;background:#f7f5eff2;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}input,select{border:1px solid #cbd3cd;border-radius:8px;background:white;padding:11px 12px;color:var(--ink);font:inherit;min-width:160px}input{flex:1;min-width:220px}input:focus,select:focus{outline:2px solid #799b97;outline-offset:2px}.status{padding:18px 5vw;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.grid{padding:0 5vw 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px}article{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}article[hidden]{display:none}.preview{display:flex;align-items:center;justify-content:center;height:270px;background:#eaece7;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.body{padding:15px}.title{font-weight:600;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.folder,.note{font-size:12px;color:var(--muted);margin-top:7px}.note{line-height:1.7}.meta{font-size:11px;color:#7c8585;margin:5px 0;overflow-wrap:anywhere}.swatches{display:flex;gap:4px;margin:9px 0}.swatch{width:16px;height:16px;border-radius:50%;border:1px solid #0001}.links{display:flex;gap:14px;margin-top:10px}.links a{font-size:12px;text-decoration:none;color:var(--accent)}.tags{font-size:11px;color:#496763;margin-top:8px}.reviewed{color:#305e60;font-size:10px;letter-spacing:1px}.empty{padding:30px 5vw;color:var(--muted)}footer{padding:20px 5vw;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}@media(max-width:600px){header{padding-top:26px}h1{font-size:25px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.preview{height:220px}.body{padding:10px}.tools{gap:8px}input,select{min-width:0;width:100%;font-size:13px}input{flex-basis:100%}select{flex:1}.links{gap:8px;flex-wrap:wrap}.status{font-size:12px}}
</style></head><body>
<header><div class="eyebrow">EAGLE / REFERENCE COLLECTION</div><h1>作品集 · 参考图库</h1><p>按你的分类找图，再按内容、配色与版式挑选。</p><p class="meta">__LIBRARY__ · 本次同步 <span id="sync">__SYNC_TIME__</span></p></header>
<div class="tools"><input id="query" aria-label="搜索参考图" placeholder="搜索分类、名称、标签、配色或视觉注释…"><select id="folder" aria-label="筛选分类"><option value="">全部分类</option></select><select id="shape" aria-label="筛选画幅"><option value="">全部画幅</option><option>长图</option><option>竖图</option><option>横图</option><option>方图</option></select></div>
<div class="status"><span id="count"></span><span>点击图片查看原图 · 分类变更在下次生成索引时同步</span></div><main class="grid" id="grid"></main><div class="empty" id="empty" hidden>没有匹配项，试试减少关键词或选择其他分类。</div><footer>文件保持在 Eagle 原图库中。色彩与画幅标签由元数据推导；“已看图”条目才包含人工视觉注释。此页面为本地索引快照。</footer>
<script id="item-data" type="application/json">__ITEM_DATA__</script><script>
const items=JSON.parse(document.getElementById('item-data').textContent), grid=document.getElementById('grid'),q=document.getElementById('query'),folder=document.getElementById('folder'),shape=document.getElementById('shape');
const e=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const folders=[...new Set(items.flatMap(x=>x.folders.length?x.folders:['未分类']))].sort((a,b)=>a.localeCompare(b,'zh-CN'));
folders.forEach(f=>{const n=e('option','',f);n.value=f;folder.append(n)});
items.forEach(item=>{const card=e('article');card.dataset.id=item.id;card.dataset.search=item.search_text.toLowerCase();card._item=item;const preview=e('a','preview');preview.href=item.original_uri;preview.target='_blank';preview.rel='noopener';const img=e('img');img.src=item.thumbnail_uri;img.alt=item.name;img.loading='lazy';preview.append(img);card.append(preview);const body=e('div','body');body.append(e('div','title',item.name),e('div','meta',item.id+' · '+item.width+' × '+item.height),e('div','folder',item.folders.join(' / ')||'未分类'));const sw=e('div','swatches');item.palettes.slice(0,6).forEach(p=>{if(!Array.isArray(p.color)||p.color.length!==3)return;const s=e('span','swatch');s.style.backgroundColor='rgb('+p.color.map(n=>Math.max(0,Math.min(255,Number(n)||0))).join(',')+')';sw.append(s)});body.append(sw);if(item.visual_note){body.append(e('div','reviewed','已看图'),e('div','note',item.visual_note))}body.append(e('div','tags',[...item.tags,...item.visual_tags].join(' · ')));const links=e('div','links');const a=e('a','','原图');a.href=item.original_uri;a.target='_blank';a.rel='noopener';links.append(a);if(/^https?:\/\//i.test(item.source_url)){const b=e('a','','原始来源');b.href=item.source_url;b.target='_blank';b.rel='noopener';links.append(b)}body.append(links);card.append(body);grid.append(card)});
function filter(){const terms=q.value.trim().toLowerCase().split(/[\s,，]+/).filter(Boolean);let n=0;for(const card of grid.children){const i=card._item;card.hidden=!(terms.every(t=>card.dataset.search.includes(t))&&(!folder.value||(i.folders.length?i.folders:['未分类']).includes(folder.value))&&(!shape.value||i.derived_tags.includes(shape.value)));if(!card.hidden)n++}document.getElementById('count').textContent=n+' / '+items.length+' 张参考图';document.getElementById('empty').hidden=n>0}
[q,folder,shape].forEach(x=>x.addEventListener('input',filter));filter();const sync=document.getElementById('sync');sync.textContent=new Date(sync.textContent).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})+' 北京时间';
</script></body></html>
